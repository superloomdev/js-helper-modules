name: superloom-test-cache-store-aws-elasticache

services:
  valkey:
    image: valkey/valkey:8
    container_name: superloom-test-cache-store-aws-elasticache
    ports:
      - "127.0.0.1:6382:6379"
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping | grep -q PONG"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s
