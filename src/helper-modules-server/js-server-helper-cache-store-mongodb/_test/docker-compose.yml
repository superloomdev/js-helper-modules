name: superloom-test-cache-store-mongodb

services:
  mongodb:
    image: mongo:8
    container_name: superloom-test-cache-store-mongodb
    ports:
      - "127.0.0.1:27018:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s
